[package]
name = "lsbx-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
lsbx-kernel = { workspace = true }
lsbx-golden = { workspace = true }
lsbx-lifecycle = { workspace = true }
lsbx-ops = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
tracing = { workspace = true }
async-trait = { workspace = true }
# Used by two handlers (upload/artifacts) to bridge an HTTP body to the
# real LsbxOps::put/get's filesystem-`&Path` signatures — production code,
# not test-only, hence a normal dependency rather than a dev-dependency.
tempfile = { workspace = true }
# Gap 1 (final integration wiring): mounts lsbx-stream's router alongside
# this crate's own — see lib.rs's module doc comment for the design.
lsbx-stream = { workspace = true }
# Gap 1: builds the second, independent SandboxStore lsbx-stream's router
# needs (SandboxStore has no Clone — see lib.rs's module doc comment).
lsbx-store = { workspace = true }

[dev-dependencies]
# Every test in this crate constructs a real LsbxOps against a real
# DemoBackend + tempfile-backed SandboxStore/CiJobStore, matching Unit 10's
# own tests/test_all_operations.rs construction pattern — never a bare
# Arc::new(LsbxOps) unit value.
lsbx-backend-demo = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
