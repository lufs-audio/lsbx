[package]
name = "lsbx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "lsbx"
path = "src/main.rs"

[dependencies]
lsbx-kernel = { workspace = true }
lsbx-store = { workspace = true }
lsbx-keys = { workspace = true }
lsbx-golden = { workspace = true }
lsbx-lifecycle = { workspace = true }
lsbx-ops = { workspace = true }
lsbx-backend-demo = { workspace = true }
lsbx-backend-libvirt = { workspace = true }
lsbx-backend-exedev = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# Gap 3 (final integration wiring): wires `bootstrap`, `mcp`, `serve`, and
# the new `ci-broker run` subcommands to their real crates — see lib.rs's
# module doc comment for the full design.
lsbx-bootstrap = { workspace = true }
lsbx-mcp = { workspace = true }
lsbx-gateway = { workspace = true }
lsbx-stream = { workspace = true }
lsbx-broker = { workspace = true }
tracing = { workspace = true }
# `dispatch_serve`'s dual-listener branch (Gap 1/3) constructs two
# `axum::serve(...)` futures directly (bypassing `lsbx-gateway`'s own
# `run_server`, which only supports the single-merged-listener case) — this
# crate therefore needs a direct `axum` dependency edge to name
# `axum::serve`/`axum::Router::into_make_service_with_connect_info` itself,
# not just transitively through `lsbx-gateway`/`lsbx-stream`.
axum = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
