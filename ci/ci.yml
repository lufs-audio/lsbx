name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: [self-hosted, "${{ vars.LSBX_CI_PLACEMENT || 'lsbx-molimo' }}"]
    # Set LSBX_CI_PLACEMENT to lsbx-carnyx only when intentionally routing
    # this repository's own CI to Carnyx. Broker jobs carry self-hosted plus
    # exactly one placement label.
    steps:
    - uses: actions/checkout@v4
    - name: cargo check
      run: cargo check --workspace --message-format=json
    - name: cargo clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: cargo test
      run: cargo test --workspace
    # Tests marked #[ignore] require real libvirt/exe.dev infrastructure and are
    # run manually/separately: cargo test --workspace -- --ignored
