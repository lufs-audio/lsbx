name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: [self-hosted, "${{ vars.LSBX_CI_PLACEMENT || 'lufs' }}"]
    # Cutover note: once lsbx's own broker is deployed and verified serving
    # the `lsbx-default` label, set the repo variable LSBX_CI_PLACEMENT to
    # "lsbx-default". No workflow file change required — see SPEC.md Deviation 15.
    steps:
    - uses: actions/checkout@v4
    - name: cargo check
      run: cargo check --workspace --message-format=json
    - name: cargo clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: cargo test
      run: cargo test --workspace
    # Tests marked #[ignore] require real libvirt/exe.dev infrastructure and are
    # run manually/separately: cargo test --workspace -- --ignored
