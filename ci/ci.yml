name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # The public lsbx repository cannot use Molimo's private-only `exe`
    # runner group; project CI runs on GitHub-hosted infrastructure.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install native dependencies
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev pkg-config
    - name: cargo check
      run: cargo check --workspace --message-format=json
    - name: cargo clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: cargo test
      run: cargo test --workspace
    # Tests marked #[ignore] require real libvirt/exe.dev infrastructure and are
    # run manually/separately: cargo test --workspace -- --ignored
