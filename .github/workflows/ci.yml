name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Runs on the Molimo zero-idle broker (`lsbx ci-broker run`), whose
    # provisioned ephemeral VM runners register with the `lsbx-default` label
    # in the org's public-repo-enabled `lsbx-default` runner group.
    runs-on: [self-hosted, lsbx-default]
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev pkg-config
      - name: cargo check
        run: cargo check --workspace --message-format=json
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace
