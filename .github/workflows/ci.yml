name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Molimo's Rust broker has completed its live lifecycle rehearsal; use
    # the repository variable for an intentional alternate placement.
    runs-on: [self-hosted, "${{ vars.LSBX_CI_PLACEMENT || 'lsbx-molimo' }}"]
    steps:
      - uses: actions/checkout@v4
      - name: cargo check
        run: cargo check --workspace --message-format=json
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace
