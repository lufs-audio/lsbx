[workspace]
members = [
    "crates/lsbx-kernel",
    "crates/lsbx-store",
    "crates/lsbx-keys",
    "crates/lsbx-backend-testkit",
    "crates/lsbx-backend-libvirt",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Daniel Ramirez <dan@lufs.org>"]
repository = "https://github.com/lufs-audio/lsbx"

[workspace.dependencies]
# Workspace crates
lsbx-kernel = { path = "crates/lsbx-kernel" }
lsbx-store = { path = "crates/lsbx-store" }
lsbx-keys = { path = "crates/lsbx-keys" }
lsbx-backend-testkit = { path = "crates/lsbx-backend-testkit" }
lsbx-backend-libvirt = { path = "crates/lsbx-backend-libvirt" }

# Async & Runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Errors & Diagnostics
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI & TUI
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"

# Web & Networking
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.26"
octocrab = "0.43"

# Cryptography & Security
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
jsonwebtoken = "9.3"

# Filesystem & IO
fs4 = { version = "0.12", features = ["tokio"] }
tempfile = "3.17"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
